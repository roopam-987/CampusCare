
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CampusCare Student Dashboard - Report and track campus issues.">

    <title>Student Dashboard | CampusCare</title>

    <!-- CampusCare Logo -->
    <link rel="icon" type="image/png" href="assets/campuscare-logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Existing CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/firebase-app.css">

    <style>
        :root {
            --cc-bg: #080d1c;
            --cc-card: rgba(19, 31, 56, 0.82);
            --cc-border: rgba(119, 151, 210, 0.17);
            --cc-blue: #398bff;
            --cc-blue-light: #69b5ff;
            --cc-purple: #9874ff;
            --cc-green: #4de0a5;
            --cc-text: #f3f6ff;
            --cc-muted: #a4b1ca;
        }

        * {
            box-sizing: border-box;
        }

        body.cc-page[data-page="student"] {
            margin: 0;
            min-height: 100vh;
            color: var(--cc-text);
            font-family: "DM Sans", sans-serif;
            background:
                radial-gradient(ellipse at 10% 0%, rgba(48, 105, 220, 0.20), transparent 38%),
                radial-gradient(ellipse at 90% 12%, rgba(135, 83, 235, 0.15), transparent 35%),
                linear-gradient(135deg, #080d1c, #0b1428 55%, #101329);
            background-attachment: fixed;
        }

        body.cc-page[data-page="student"] h1,
        body.cc-page[data-page="student"] h2,
        body.cc-page[data-page="student"] h3 {
            font-family: "Manrope", sans-serif;
            color: #fff;
        }

        /* HEADER */

        body.cc-page[data-page="student"] .cc-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 13px 6%;
            background: rgba(8, 13, 28, 0.88);
            border-bottom: 1px solid var(--cc-border);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        body.cc-page[data-page="student"] .cc-brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: #fff;
            text-decoration: none;
            font-family: "Manrope", sans-serif;
            font-size: 21px;
            font-weight: 800;
        }

        body.cc-page[data-page="student"] .cc-brand img {
            width: 46px;
            height: 46px;
            object-fit: contain;
            border-radius: 12px;
            flex-shrink: 0;
        }

        body.cc-page[data-page="student"] .cc-header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            color: #dce6fa;
            font-size: 14px;
        }

        #userName {
            font-weight: 600;
        }

        /* BUTTONS */

        body.cc-page[data-page="student"] .cc-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            padding: 11px 19px;
            border-radius: 10px;
            font-family: "DM Sans", sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
        }

        body.cc-page[data-page="student"] .cc-button:hover {
            transform: translateY(-2px);
        }

        body.cc-page[data-page="student"] .cc-primary {
            color: white;
            background: linear-gradient(110deg, #287ff4, #6957ec);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 7px 22px rgba(36, 117, 232, 0.25);
        }

        body.cc-page[data-page="student"] .cc-primary:hover {
            box-shadow: 0 10px 28px rgba(36, 117, 232, 0.4);
        }

        body.cc-page[data-page="student"] .cc-outline {
            color: #dceaff;
            background: rgba(47, 105, 180, 0.12);
            border: 1px solid rgba(100, 165, 255, 0.35);
        }

        body.cc-page[data-page="student"] .cc-outline:hover {
            background: rgba(47, 105, 180, 0.25);
        }

        /* MAIN CONTAINER */

        body.cc-page[data-page="student"] .cc-container {
            width: min(1100px, 90%);
            margin: 0 auto;
            padding: 48px 0 70px;
        }

        /* PAGE HEADING */

        body.cc-page[data-page="student"] .cc-heading {
            position: relative;
            margin-bottom: 30px;
            padding: 30px;
            overflow: hidden;
            border: 1px solid rgba(77, 143, 255, 0.2);
            border-radius: 19px;
            background:
                linear-gradient(115deg, rgba(48, 88, 180, 0.17), rgba(115, 76, 190, 0.11)),
                rgba(17, 27, 49, 0.72);
        }

        body.cc-page[data-page="student"] .cc-heading::after {
            content: "";
            position: absolute;
            width: 200px;
            height: 200px;
            right: -65px;
            top: -105px;
            border-radius: 50%;
            background: rgba(57, 139, 255, 0.13);
            pointer-events: none;
        }

        body.cc-page[data-page="student"] .cc-eyebrow {
            margin: 0;
            color: #80b4ff;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        body.cc-page[data-page="student"] .cc-heading h1 {
            margin: 10px 0;
            color: #fff;
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 800;
            letter-spacing: -1.4px;
        }

        body.cc-page[data-page="student"] .cc-heading > p:last-child {
            margin: 0;
            color: var(--cc-muted);
            font-size: 15px;
            line-height: 1.7;
        }

        /* STATISTICS */

        body.cc-page[data-page="student"] .cc-stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
            margin-bottom: 24px;
        }

        body.cc-page[data-page="student"] .cc-panel {
            min-width: 0;
            margin-bottom: 22px;
            padding: 26px;
            color: var(--cc-text);
            background: var(--cc-card);
            border: 1px solid var(--cc-border);
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.16);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        body.cc-page[data-page="student"] .cc-stats .cc-panel {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 0;
            overflow: hidden;
            transition: transform 0.25s, border-color 0.25s;
        }

        body.cc-page[data-page="student"] .cc-stats .cc-panel:hover {
            transform: translateY(-5px);
            border-color: rgba(70, 145, 255, 0.5);
        }

        body.cc-page[data-page="student"] .cc-stats .cc-panel::after {
            content: "";
            position: absolute;
            width: 100px;
            height: 100px;
            right: -35px;
            bottom: -40px;
            border-radius: 50%;
            background: rgba(57, 139, 255, 0.12);
        }

        body.cc-page[data-page="student"] .cc-stats .cc-panel:nth-child(2)::after {
            background: rgba(155, 116, 255, 0.14);
        }

        body.cc-page[data-page="student"] .cc-stats .cc-panel:nth-child(3)::after {
            background: rgba(77, 224, 165, 0.13);
        }

        body.cc-page[data-page="student"] .cc-stats span {
            color: var(--cc-muted);
            font-size: 14px;
            font-weight: 600;
        }

        body.cc-page[data-page="student"] .cc-stats strong {
            color: #7eb3ff;
            font-family: "Manrope", sans-serif;
            font-size: 35px;
            font-weight: 800;
        }

        body.cc-page[data-page="student"] .cc-stats .cc-panel:nth-child(2) strong {
            color: #b69aff;
        }

        body.cc-page[data-page="student"] .cc-stats .cc-panel:nth-child(3) strong {
            color: #55dfad;
        }

        /* FORM AND CONTENT PANELS */

        body.cc-page[data-page="student"] .cc-panel h2 {
            margin: 0 0 22px;
            color: #fff;
            font-size: 21px;
            font-weight: 800;
        }

        body.cc-page[data-page="student"] form label {
            display: block;
            margin: 19px 0 8px;
            color: #dce8fa;
            font-size: 14px;
            font-weight: 700;
        }

        body.cc-page[data-page="student"] form input:not([type="file"]),
        body.cc-page[data-page="student"] form select,
        body.cc-page[data-page="student"] form textarea {
            width: 100%;
            min-height: 48px;
            padding: 13px 15px;
            color: #f4f8ff;
            background: rgba(5, 17, 34, 0.75);
            border: 1px solid rgba(150, 180, 220, 0.2);
            border-radius: 11px;
            outline: none;
            font: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        body.cc-page[data-page="student"] form input[type="file"] {
            display: block;
            width: 100%;
            padding: 13px;
            color: var(--cc-muted);
            background: rgba(5, 17, 34, 0.75);
            border: 1px dashed rgba(150, 180, 220, 0.3);
            border-radius: 11px;
            font: inherit;
        }

        body.cc-page[data-page="student"] form input:focus,
        body.cc-page[data-page="student"] form select:focus,
        body.cc-page[data-page="student"] form textarea:focus {
            border-color: var(--cc-blue);
            box-shadow: 0 0 0 3px rgba(57, 136, 255, 0.15);
        }

        body.cc-page[data-page="student"] form input::placeholder,
        body.cc-page[data-page="student"] form textarea::placeholder {
            color: #7186a4;
        }

        body.cc-page[data-page="student"] form select option {
            color: #fff;
            background: #10243e;
        }

        body.cc-page[data-page="student"] form textarea {
            min-height: 115px;
            resize: vertical;
        }

        body.cc-page[data-page="student"] #reportForm .cc-primary {
            width: 100%;
            margin-top: 22px;
            min-height: 50px;
            font-size: 15px;
        }

        body.cc-page[data-page="student"] #getLocation {
            margin-top: 12px;
        }

        /* MESSAGES */

        body.cc-page[data-page="student"] .cc-small {
            color: var(--cc-muted);
            font-size: 13px;
            line-height: 1.6;
        }

        body.cc-page[data-page="student"] .cc-message {
            color: var(--cc-blue-light);
            font-size: 14px;
            line-height: 1.6;
        }

        body.cc-page[data-page="student"] #locationMessage {
            margin-top: 8px;
        }

        body.cc-page[data-page="student"] #reportMessage {
            margin-top: 12px;
        }

        /* REPORTS AND NOTIFICATIONS */

        body.cc-page[data-page="student"] #myReports,
        body.cc-page[data-page="student"] #notifications {
            color: var(--cc-muted);
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        body.cc-page[data-page="student"] #myReports > *,
        body.cc-page[data-page="student"] #notifications > * {
            margin-bottom: 12px;
        }

        body.cc-page[data-page="student"] #myReports button,
        body.cc-page[data-page="student"] #notifications button {
            font-family: inherit;
        }

        body.cc-page[data-page="student"] #myReports a,
        body.cc-page[data-page="student"] #notifications a {
            color: #83b7ff;
        }

        /* RESPONSIVE */

        @media (max-width: 650px) {
            body.cc-page[data-page="student"] .cc-header {
                padding: 12px 5%;
            }

            body.cc-page[data-page="student"] .cc-brand {
                font-size: 18px;
            }

            body.cc-page[data-page="student"] .cc-brand img {
                width: 39px;
                height: 39px;
            }

            body.cc-page[data-page="student"] .cc-header-right {
                gap: 9px;
                font-size: 12px;
            }

            body.cc-page[data-page="student"] .cc-container {
                width: 92%;
                padding-top: 30px;
            }

            body.cc-page[data-page="student"] .cc-heading {
                padding: 22px;
            }

            body.cc-page[data-page="student"] .cc-stats {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            body.cc-page[data-page="student"] .cc-stats .cc-panel {
                padding: 19px;
            }

            body.cc-page[data-page="student"] .cc-stats strong {
                font-size: 28px;
            }

            body.cc-page[data-page="student"] .cc-panel {
                padding: 20px;
                border-radius: 16px;
            }
        }

        @media (max-width: 380px) {
            body.cc-page[data-page="student"] .cc-header-right {
                gap: 6px;
            }

            body.cc-page[data-page="student"] .cc-header-right .cc-button {
                padding: 8px 11px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body class="cc-page" data-page="student">

    <!-- HEADER -->
    <header class="cc-header">

        <a href="index.html" class="cc-brand">
            <img src="assets/campuscare-logo.png" alt="CampusCare Logo">
            <span>CampusCare</span>
        </a>

        <div class="cc-header-right">
            <span id="userName"></span>

            <button class="cc-button cc-outline" id="logout">
                Logout
            </button>
        </div>

    </header>


    <!-- MAIN DASHBOARD -->
    <main class="cc-container">

        <!-- PAGE HEADING -->
        <div class="cc-heading">

            <p class="cc-eyebrow">STUDENT PORTAL</p>

            <h1>Report a campus issue</h1>

            <p>Help us make your campus safer and better.</p>

        </div>


        <!-- STATISTICS -->
        <section class="cc-stats">

            <article class="cc-panel">
                <span>Total reports</span>
                <strong id="totalCount">0</strong>
            </article>

            <article class="cc-panel">
                <span>In progress</span>
                <strong id="progressCount">0</strong>
            </article>

            <article class="cc-panel">
                <span>Resolved</span>
                <strong id="resolvedCount">0</strong>
            </article>

        </section>


        <!-- SUBMIT REPORT -->
        <section class="cc-panel">

            <h2>Submit a new report</h2>

            <form id="reportForm">

                <label>Issue title</label>

                <input
                    name="title"
                    required
                    maxlength="100"
                    placeholder="Example: Broken classroom fan"
                >

                <label>Category</label>

                <select name="category" required>
                    <option value="">Select category</option>
                    <option>Electrical</option>
                    <option>Plumbing</option>
                    <option>Cleanliness</option>
                    <option>Furniture</option>
                    <option>Infrastructure</option>
                    <option>Wi-Fi / Network</option>
                    <option>Other</option>
                </select>

                <label>Location</label>

                <input
                    name="location"
                    required
                    maxlength="150"
                    placeholder="Building, floor, room or area"
                >

                <button
                    type="button"
                    id="getLocation"
                    class="cc-button cc-outline"
                >
                    Use my current location
                </button>

                <p id="locationMessage" class="cc-small"></p>

                <label>Priority</label>

                <select name="priority" required>
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                    <option value="Urgent">Urgent</option>
                </select>

                <label>Description</label>

                <textarea
                    name="description"
                    required
                    maxlength="1500"
                    rows="4"
                    placeholder="Explain the issue clearly..."
                ></textarea>

                <label>Upload an image (optional)</label>

                <input
                    type="file"
                    name="image"
                    accept="image/png,image/jpeg,image/webp"
                >

                <button class="cc-button cc-primary" type="submit">
                    Submit report
                </button>

                <p
                    id="reportMessage"
                    class="cc-message"
                    aria-live="polite"
                ></p>

            </form>

        </section>


        <!-- MY REPORTS -->
        <section class="cc-panel">

            <h2>My reports</h2>

            <div id="myReports">
                Loading reports...
            </div>

        </section>


        <!-- NOTIFICATIONS -->
        <section class="cc-panel">

            <h2>Notifications</h2>

            <div id="notifications">
                Loading notifications...
            </div>

        </section>

    </main>


    <!-- EXISTING APPLICATION LOGIC -->
    <script type="module" src="js/app.js"></script>

</body>
</html>
