
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Worker Dashboard | CampusCare</title>

  <link rel="icon" type="image/png" href="assets/campuscare-logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/firebase-app.css">

  <style>
    :root {
      --cc-bg: #071426;
      --cc-card: rgba(17, 36, 62, 0.78);
      --cc-border: rgba(148, 185, 230, 0.16);
      --cc-blue: #3988ff;
      --cc-blue-light: #65b5ff;
      --cc-text: #f3f7ff;
      --cc-muted: #9eb0c9;
    }

    * {
      box-sizing: border-box;
    }

    body.cc-page {
      margin: 0;
      min-height: 100vh;
      color: var(--cc-text);
      font-family: "DM Sans", sans-serif;
      background:
        radial-gradient(ellipse at 10% 0%, rgba(35, 105, 205, 0.25), transparent 38%),
        radial-gradient(ellipse at 90% 20%, rgba(20, 75, 150, 0.18), transparent 35%),
        linear-gradient(135deg, #06101f, #0a1d35 55%, #071426);
      background-attachment: fixed;
    }

    .cc-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 6%;
      background: rgba(5, 16, 31, 0.82);
      border-bottom: 1px solid var(--cc-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .cc-brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: #fff;
      text-decoration: none;
      font-family: "Manrope", sans-serif;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .cc-brand img {
      width: 45px;
      height: 45px;
      object-fit: contain;
      border-radius: 11px;
    }

    .cc-header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--cc-muted);
      font-size: 14px;
    }

    .cc-container {
      width: min(1100px, 90%);
      margin: 0 auto;
      padding: 48px 0 70px;
    }

    .cc-heading {
      margin-bottom: 30px;
    }

    .cc-eyebrow {
      color: var(--cc-blue-light);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .cc-heading h1 {
      margin: 10px 0;
      color: #fff;
      font-family: "Manrope", sans-serif;
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 800;
      letter-spacing: -1.4px;
    }

    .cc-heading > p:last-child {
      color: var(--cc-muted);
      font-size: 16px;
      line-height: 1.6;
    }

    .cc-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }

    .cc-panel {
      margin-bottom: 22px;
      padding: 26px;
      color: var(--cc-text);
      background: var(--cc-card);
      border: 1px solid var(--cc-border);
      border-radius: 20px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.16);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .cc-stats .cc-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 0;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .cc-stats .cc-panel:hover {
      transform: translateY(-4px);
      border-color: rgba(70, 145, 255, 0.5);
    }

    .cc-stats span {
      color: var(--cc-muted);
      font-size: 14px;
      font-weight: 600;
    }

    .cc-stats strong {
      color: #fff;
      font-family: "Manrope", sans-serif;
      font-size: 34px;
      font-weight: 800;
    }

    .cc-panel h2 {
      margin: 0 0 22px;
      color: #fff;
      font-family: "Manrope", sans-serif;
      font-size: 21px;
      font-weight: 800;
    }

    .cc-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 11px 19px;
      border-radius: 10px;
      font-family: "DM Sans", sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .cc-button:hover {
      transform: translateY(-2px);
    }

    .cc-primary {
      color: white;
      background: linear-gradient(135deg, #2878ed, #48a3ff);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 7px 22px rgba(36, 117, 232, 0.25);
    }

    .cc-primary:hover {
      box-shadow: 0 10px 28px rgba(36, 117, 232, 0.4);
    }

    .cc-outline {
      color: #dceaff;
      background: rgba(47, 105, 180, 0.12);
      border: 1px solid rgba(100, 165, 255, 0.35);
    }

    .cc-outline:hover {
      background: rgba(47, 105, 180, 0.25);
    }

    #workerTasks,
    #notifications {
      color: var(--cc-muted);
      line-height: 1.7;
    }

    #workerTasks > *,
    #notifications > * {
      margin-bottom: 12px;
    }

    /* Task cards and dynamically generated content */
    #workerTasks .cc-panel,
    #notifications .cc-panel {
      background: rgba(7, 24, 45, 0.75);
      border-color: var(--cc-border);
    }

    #workerTasks button,
    #notifications button {
      margin: 5px 7px 5px 0;
    }

    @media (max-width: 650px) {
      .cc-header {
        padding: 12px 5%;
      }

      .cc-brand {
        font-size: 18px;
      }

      .cc-brand img {
        width: 39px;
        height: 39px;
      }

      .cc-header-right {
        gap: 9px;
        font-size: 12px;
      }

      .cc-container {
        width: 92%;
        padding-top: 32px;
      }

      .cc-stats {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .cc-stats .cc-panel {
        padding: 19px;
      }

      .cc-stats strong {
        font-size: 28px;
      }

      .cc-panel {
        padding: 20px;
        border-radius: 16px;
      }
    }
  </style>
</head>

<body class="cc-page" data-page="worker">

  <header class="cc-header">

    <a href="index.html" class="cc-brand">
      <img src="assets/campuscare-logo.png" alt="CampusCare Logo">
      <span>CampusCare</span>
    </a>

    <div class="cc-header-right">
      <span id="userName"></span>

      <button class="cc-button cc-outline" id="logout">
        Logout
      </button>
    </div>

  </header>

  <main class="cc-container">

    <div class="cc-heading">
      <p class="cc-eyebrow">MAINTENANCE TEAM</p>

      <h1>Assigned tasks</h1>

      <p>
        View your assigned campus issues and update their progress.
      </p>
    </div>

    <section class="cc-stats">

      <article class="cc-panel">
        <span>Assigned tasks</span>
        <strong id="totalCount">0</strong>
      </article>

      <article class="cc-panel">
        <span>In progress</span>
        <strong id="progressCount">0</strong>
      </article>

      <article class="cc-panel">
        <span>Completed</span>
        <strong id="resolvedCount">0</strong>
      </article>

    </section>

    <section class="cc-panel">

      <h2>My work</h2>

      <div id="workerTasks">
        Loading tasks...
      </div>

    </section>

    <section class="cc-panel">

      <h2>Notifications</h2>

      <div id="notifications">
        Loading notifications...
      </div>

    </section>

  </main>

  <script type="module" src="js/app.js"></script>

</body>
</html>
